services:
  - type: web
    name: diploma-quiz-portal
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: TEACHER_USERNAME
        sync: false
      - key: TEACHER_PASSWORD
        sync: false
      - key: SQLITE_PATH
        value: /var/data/quiz_database.db
      - key: COOKIE_SECURE
        value: "1"
